<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scam 💖</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Poppins', Arial, sans-serif;
            background: radial-gradient(circle at top, #ff9a9e, #ff3c7b);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        h1 {
            color: white;
            font-size: 2.6rem;
            text-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        button {
            padding: 16px 34px;
            font-size: 1.2rem;
            border: none;
            border-radius: 22px;
            cursor: pointer;
        }

        #yes {
            background: #2ecc71;
            color: white;
        }

        #no {
            background: #e74c3c;
            color: white;
            position: fixed;
            transition: left 0.12s linear, top 0.12s linear;
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            font-size: 22px;
            animation: floatUp 5s linear forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            from {
                transform: translateY(0) scale(0.6);
                opacity: 1;
            }

            to {
                transform: translateY(-520px) scale(2);
                opacity: 0;
            }
        }

        /* Emoji fireworks */
        .firework {
            position: absolute;
            font-size: 30px;
            animation: explode 2.2s ease-out forwards;
        }

        @keyframes explode {
            from {
                transform: scale(0);
                opacity: 1;
            }

            to {
                transform: translate(var(--x), var(--y)) scale(2);
                opacity: 0;
            }
        }

        /* Canvas fireworks */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <canvas id="fw"></canvas>

    <div id="content">
        <h1 id="title">Swetaaa - Will you be my Valentine? 💘</h1><br><br>
        <button id="yes">Yes 💖</button>
        <button id="no">No 🙈</button>
    </div>

    <script>
        const noBtn = document.getElementById("no");
        const yesBtn = document.getElementById("yes");
        const title = document.getElementById("title");

        let celebrating = false;
        let heartTimer, emojiTimer, canvasTimer;

        /* ===== NO BUTTON UNREACHABLE ===== */
        function moveNo() {
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 60);
            noBtn.style.left = x + "px";
            noBtn.style.top = y + "px";
        }

        document.addEventListener("mousemove", e => {
            if (celebrating) return;
            const r = noBtn.getBoundingClientRect();
            const dx = e.clientX - (r.left + r.width / 2);
            const dy = e.clientY - (r.top + r.height / 2);
            if (Math.hypot(dx, dy) < 260) moveNo();
        });

        document.addEventListener("touchstart", () => {
            if (!celebrating) moveNo();
        });

        /* ===== YES CLICK ===== */
        yesBtn.addEventListener("click", () => {
            celebrating = true;
            noBtn.remove();
            yesBtn.remove();
            title.innerText = "YAYYYY CUTIEEE PIEEE 💕😘";

            startHearts();
            startEmojiFireworks();
            startCanvasFireworks();

            setTimeout(stopAll, 5 * 60 * 1000); // 5 minutes
        });

        /* ===== HEARTS ===== */
        function startHearts() {
            heartTimer = setInterval(() => {
                const h = document.createElement("div");
                h.className = "heart";
                h.innerText = "❤️";
                h.style.left = Math.random() * window.innerWidth + "px";
                h.style.top = window.innerHeight + "px";
                document.body.appendChild(h);
                setTimeout(() => h.remove(), 5000);
            }, 180);
        }

        /* ===== EMOJI FIREWORKS ===== */
        function startEmojiFireworks() {
            const emojis = ["❤️", "💖", "😘", "💕"];
            emojiTimer = setInterval(() => {
                const cx = Math.random() * window.innerWidth;
                const cy = Math.random() * window.innerHeight * 0.7;
                for (let i = 0; i < 22; i++) {
                    const fw = document.createElement("div");
                    fw.className = "firework";
                    fw.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                    const a = i * (Math.PI * 2 / 22);
                    const r = 160;
                    fw.style.left = cx + "px";
                    fw.style.top = cy + "px";
                    fw.style.setProperty("--x", Math.cos(a) * r + "px");
                    fw.style.setProperty("--y", Math.sin(a) * r + "px");
                    document.body.appendChild(fw);
                    setTimeout(() => fw.remove(), 2200);
                }
            }, 900);
        }

        /* ===== REAL FIREWORKS (CANVAS) ===== */
        const canvas = document.getElementById("fw");
        const ctx = canvas.getContext("2d");
        resize();

        window.addEventListener("resize", resize);
        function resize() {
            canvas.width = innerWidth;
            canvas.height = innerHeight;
        }

        let particles = [];

        function startCanvasFireworks() {
            canvasTimer = setInterval(() => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.6;
                for (let i = 0; i < 60; i++) {
                    particles.push({
                        x, y,
                        vx: Math.cos(i) * (Math.random() * 4),
                        vy: Math.sin(i) * (Math.random() * 4),
                        life: 60,
                        color: `hsl(${Math.random() * 360},100%,70%)`
                    });
                }
            }, 800);
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 3, 3);
                if (p.life <= 0) particles.splice(i, 1);
            });
            if (celebrating) requestAnimationFrame(animate);
        }

        /* ===== STOP AFTER 5 MIN ===== */
        function stopAll() {
            clearInterval(heartTimer);
            clearInterval(emojiTimer);
            clearInterval(canvasTimer);
        }
    </script>

</body>

</html>
